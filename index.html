<style>
:root{
  --bg:#ffffff;
  --ink:#1a1814;
  --muted:#7a746a;
  --line:#ebebeb;
  --rust:#b0703e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}

.top{display:flex;justify-content:flex-start;align-items:center;padding:16px 16px 12px;max-width:1400px;width:100%;margin:0 auto}
.home{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);padding:8px 2px;transition:color .2s}
.home:hover{color:var(--rust)}

.hero{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:32px;width:100%;padding:0 0 48px}
.banner{width:100%;max-width:1400px;padding:0 16px}
.banner h1{margin:0}
.banner{margin-top:clamp(20px,4vw,48px)}
.banner img{display:block;width:100%;height:clamp(118px,24vw,330px);object-fit:cover;object-position:center;border-radius:4px}

.copy{text-align:left;width:100%;max-width:1400px;padding:0 16px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.sub{max-width:36ch;margin:0 auto 28px;font-size:16px;line-height:1.55;color:var(--muted)}

.cta{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:16px 28px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;transition:background .2s,color .2s,transform .2s}
.cta:hover{background:var(--rust)}
.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}
button.cta{border:0;cursor:pointer;font-family:inherit}
.opts{display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
.opts .cta{width:200px;justify-content:center}
.res{display:inline-block;line-height:0;margin-top:clamp(14px,3vw,36px);transition:transform .2s,filter .2s}
.res-img{display:block;height:clamp(44px,7vw,84px);width:auto;max-width:100%}
.res:hover{transform:translateY(-2px);filter:brightness(1.1) drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.opts[hidden]{display:none}
.opt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:160px;padding:14px 22px;border:2px solid var(--ink);border-radius:999px;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);transition:background .2s,color .2s}
a.opt:hover{background:var(--ink);color:var(--bg)}
.opt.off{border-color:var(--line);color:var(--muted);cursor:default}
.opt small{font-size:10px;font-weight:600;letter-spacing:.12em;margin-top:2px}

.foot{border-top:1px solid var(--line);padding:20px 20px 18px;font-size:12px;color:var(--muted);text-align:center}
.social{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;width:100%;margin-top:clamp(64px,11vw,130px)}
.soc{display:block;transition:transform .2s,filter .2s}
.soc img{display:block;height:clamp(64px,9vw,96px);width:auto}
.globe{width:260px;max-width:100%;margin:4px auto 10px}
.soc:hover{transform:translateY(-3px);filter:brightness(1.12) drop-shadow(0 4px 6px rgba(0,0,0,.25))}
</style>
</head>
