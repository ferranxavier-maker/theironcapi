<meta name="description" content="The Iron Capi — Pitch & Putt en Catalunya. Resultados, estadísticas y récords de Ferran Lobón.">

<title>The Iron Capi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f1ea;
  --ink:#111111;
  --muted:#6b6862;
  --line:#d9d4c8;
  --green:#1a7f4b;
  --green-dark:#12603a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);min-height:100%}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}

.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:1080px;width:100%;margin:0 auto;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.top span{color:var(--muted)}

.hero{flex:1;display:grid;grid-template-columns:1fr;align-items:center;align-content:center;gap:8px;max-width:1080px;width:100%;margin:0 auto;padding:8px 20px 40px}
.portrait{display:flex;justify-content:center}
.portrait img{width:min(68vw,320px);height:auto;display:block}

.copy{text-align:center}
.kicker{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.88;letter-spacing:.01em;font-size:clamp(64px,18vw,148px)}
h1 small{display:block;font-size:.36em;letter-spacing:.32em;margin-bottom:.12em}
.sub{margin:18px auto 28px;max-width:34ch;font-size:16px;line-height:1.5;color:var(--muted)}

.cta{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper);padding:16px 26px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,transform .2s}
.cta:hover{background:var(--green)}
.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}

.foot{border-top:1px solid var(--line);padding:16px 20px;font-size:12px;color:var(--muted);text-align:center}

@media (min-width:820px){
  .hero{grid-template-columns:1fr 1.1fr;gap:40px;padding-bottom:64px}
  .portrait{justify-content:flex-end}
  .portrait img{width:min(38vw,420px)}
  .copy{text-align:left}
  .sub{margin-left:0}
}
</style>
</head>
