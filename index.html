<style>
:root{
  --bg:#f6f3ee;
  --ink:#1a1814;
  --muted:#7a746a;
  --line:#e2ddd3;
  --rust:#b0703e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}

.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;max-width:1200px;width:100%;margin:0 auto;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:32px;width:100%;padding:16px 0 48px}
.banner{width:100%;max-width:1400px;padding:0 16px}
.banner h1{margin:0}
.banner img{display:block;width:100%;height:clamp(150px,24vw,330px);object-fit:cover;object-position:center;border-radius:6px;box-shadow:0 20px 50px rgba(40,30,20,.25)}

.copy{text-align:center;padding:0 20px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.sub{max-width:36ch;margin:0 auto 28px;font-size:16px;line-height:1.55;color:var(--muted)}

.cta{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:16px 28px;border-radius:999px;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;transition:background .2s,color .2s,transform .2s}
.cta:hover{background:var(--rust)}
.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}

.foot{border-top:1px solid var(--line);padding:16px 20px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
