<title>The Iron Capi</title>

<style>
:root{--bg:#ffffff;--ink:#1a1814;--muted:#7a746a;--rust:#b0703e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
a{color:inherit;text-decoration:none}
.top{display:flex;justify-content:flex-start;align-items:center;padding:16px 16px 12px;max-width:1400px;width:100%;margin:0 auto}
.home{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);padding:8px 2px;transition:color .2s}
.home:hover{color:var(--rust)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 20px 64px;text-align:center}
.face{display:block;width:min(60vw,280px);height:auto}
.msg{font-size:clamp(24px,6vw,40px);font-weight:800;line-height:1.25}
.msg span{display:block;font-weight:600;color:var(--muted);font-size:.7em;margin-top:6px}
.board{display:inline-flex;flex-direction:column;align-items:center;gap:10px;background:#1c1a17;padding:14px 18px 16px;border-radius:6px;
  border:3px solid #3a332b;box-shadow:inset 0 0 0 2px #0e0d0b,0 8px 20px rgba(0,0,0,.25)}
.board-lbl{font-size:12px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:#e8c46a}
.digits{display:flex;gap:6px}
.d{position:relative;width:clamp(30px,8vw,44px);height:clamp(46px,12vw,66px);background:linear-gradient(#2b2824 0 50%,#24211d 50% 100%);
  border-radius:4px;box-shadow:inset 0 -2px 3px rgba(0,0,0,.6),0 2px 0 #0e0d0b;display:grid;place-items:center;overflow:hidden;
  font-family:"Courier New",ui-monospace,monospace;font-weight:700;font-size:clamp(30px,8vw,46px);color:#f2ead8}
.d::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#0e0d0b}
.d.flip{animation:flip .18s ease-in}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.emoji{font-size:clamp(44px,10vw,64px);line-height:1}
</style>
