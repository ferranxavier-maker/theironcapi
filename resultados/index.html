<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{background:#fff;min-height:100%}body{font-family:system-ui,sans-serif;font-size:13px;color:#333}.tab{padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:#888;white-space:nowrap}.tab.active{color:var(--tc);border-bottom-color:var(--tc)}.controls{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid #ddd;flex-wrap:wrap;align-items:center;background:#fff;position:sticky;top:75px;z-index:8}input,select{font-size:11px;padding:3px 7px;border:1px solid #ccc;border-radius:4px;height:26px;background:#fff}.wrap{overflow:auto;max-height:calc(100vh - 130px)}table{border-collapse:collapse;font-size:10px;table-layout:fixed}th{padding:4px 3px;font-weight:600;font-size:10px;color:#555;background:#d8e4f0;border-bottom:2px solid #b0c8e0;border-right:1px solid #c0d0e0;white-space:nowrap;text-align:center;position:sticky;top:0;z-index:2}td{border-bottom:1px solid #eee;padding:2px 2px;text-align:center;white-space:nowrap;overflow:hidden}.card{background:#f8f8f8;border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:16px;max-width:420px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}.stat-box{border-radius:10px;padding:10px 12px}.rec-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border-radius:8px;margin-bottom:6px;border:1px solid #e8e8e8}.rec-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;font-weight:700}.win-header{border-radius:12px;padding:16px 24px;margin-bottom:14px;text-align:center;position:relative;min-height:100px}.win-side{position:absolute;top:50%;transform:translateY(-50%);text-align:center}.section{padding:14px 18px;max-width:980px}.section-title{font-size:10px;font-weight:700;color:#999;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}.mini-table{width:100%;border-collapse:collapse;font-size:10px;border:1px solid #eee}.mini-table th{background:#f0f4f8;padding:4px 5px;font-size:9px;font-weight:600;color:#666;border-bottom:1px solid #eee;text-align:center}.mini-table td{padding:3px 5px;text-align:center;border-bottom:1px solid #f5f5f5}.mini-table tr:nth-child(even) td{background:#fafafa}
</style>
</head>
<body>
<div style="border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10;background:#fff;padding:8px 14px 0">
  <h1 id="hdr" style="font-size:14px;font-weight:700;margin-bottom:6px">&#9971; Iron Capi</h1>
  <div style="display:flex;overflow-x:auto;border-top:1px solid #f0f0f0">
    <div class="tab" data-tab="nueva" style="--tc:#00a896;font-size:18px;font-weight:700">&#10133;</div>
    <div class="tab active" data-tab="tabla" style="--tc:#1a7f4b">&#128203; Tabla</div>
    <div class="tab" data-tab="stats" style="--tc:#6d28d9">&#128202; Stats</div>
    <div class="tab" data-tab="records" style="--tc:#b8860b">&#127942; Records</div>
    <div class="tab" data-tab="last10" style="--tc:#1565c0">&#129351; Last 10</div>
    <div class="tab" data-tab="last20" style="--tc:#0e7490">&#129352; Last 20</div>
    <div class="tab" data-tab="last30" style="--tc:#0f766e">&#129353; Last 30</div>
    <div class="tab" data-tab="comandos" style="--tc:#dc2626">&#9881; Comandos</div>
  </div>
</div>
<div id="pane-nueva" style="display:none">
<style>
  /* ========== TARJETA - Spec Ferran ========== */
  #pane-nueva{background:#edf0f4;--tj-cell-h:38px}
  #pane-nueva *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #pane-nueva h2, #pane-nueva h3, #pane-nueva h4, #pane-nueva p,
  #pane-nueva table, #pane-nueva td, #pane-nueva tr{margin:0;padding:0}
  #pane-nueva button, #pane-nueva input, #pane-nueva select{margin:0;font-family:inherit}
  .tj-app{max-width:520px;margin:0 auto;background:#edf0f4;font-family:-apple-system,'Segoe UI',sans-serif;color:#1a1a2e;min-height:100vh;padding-bottom:20px}

  /* Header */
  .tj-hdr{background:#fff;margin:10px 8px 0;padding:10px 14px;display:flex;gap:10px;align-items:center;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .tj-logo{display:flex;align-items:center;flex-shrink:0}
  .tj-sel{flex:1;min-width:0;padding:7px 10px;border-radius:10px;border:1.5px solid #e8ecf0;background:#edf0f4;font-size:12px;font-weight:600;color:#1a1a2e;outline:none;cursor:pointer;font-family:inherit;height:auto;line-height:normal}
  .tj-pill{background:#e8f8f5;border-radius:14px;padding:8px 12px;text-align:center;flex-shrink:0}
  .tj-pill-num{font-size:20px;font-weight:700;color:#00a896;line-height:1}
  .tj-pill-lbl{font-size:9px;color:#8a95a3;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
  .tj-manual{display:none;background:#fff;margin:6px 8px 0;padding:8px 14px;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .tj-manual.show{display:block}
  .tj-manual input{width:100%;padding:7px 10px;border-radius:10px;border:1.5px solid #e8ecf0;background:#edf0f4;font-size:12px;outline:none;font-family:inherit;color:#1a1a2e}

  /* Secciones de tablas */
  .tj-sec{background:#fff;margin:10px 8px 0;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .tj-sec-title{padding:10px 14px 4px;font-size:10px;font-weight:700;color:#8a95a3;text-transform:uppercase;letter-spacing:1.5px}
  .tj-tbl{width:100%;border-collapse:separate;border-spacing:2px;font-size:12px;padding:0 8px 8px;table-layout:fixed}
  .tj-tbl td{height:var(--tj-cell-h);border-radius:9px;text-align:center;cursor:pointer}

  /* Etiqueta lateral */
  .tj-lbl{text-align:center;font-size:20px;white-space:nowrap;width:44px;height:var(--tj-cell-h);border-radius:9px;border-left:3px solid transparent}
  .tj-lbl.as{background:#e8f8f5;border-left-color:#00a896}
  .tj-lbl.ap{background:#f3eeff;border-left-color:#7c5cbf}
  .tj-lbl.ad{background:#fff4e8;border-left-color:#e67e22}
  .tj-lbl.ao{background:#fff8ee;border-left-color:#b7770d}
  .tj-lbl.an{background:#fdecea;border-left-color:#e05252}
  .tj-lbl.act{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08)}
  .tj-hdr-lbl{text-align:left;font-size:18px;color:#9aa4b1;font-weight:300;padding-left:6px;font-family:Georgia,serif}

  /* Cabecera (numero hoyo) */
  .tj-h{background:#c8cdd6;color:#6b737c;font-size:11px;font-weight:600}
  .tj-h.sel{background:#1a1a2e;color:#fff;font-weight:700}
  .tj-sum{font-size:10px;font-weight:700}
  .tj-sum-out{background:#e8f8f5;color:#00a896}
  .tj-sum-score{background:#e8f8f5;color:#00a896}
  .tj-sum-putt{background:#f0eeff;color:#7c5cbf}
  .tj-sum-ban{background:#fff4e8;color:#e67e22}
  .tj-sum-obs{background:#fff8ee}
  .tj-sum-pen{background:#fdecea}

  /* Celdas de datos */
  .tj-c{background:#edf0f4;font-weight:600}
  .tj-c.sel-as{outline:2.5px solid #00a896;outline-offset:-2px}
  .tj-c.sel-ap{outline:2.5px solid #7c5cbf;outline-offset:-2px}
  .tj-c.sel-ad{outline:2.5px solid #e67e22;outline-offset:-2px}
  .tj-c.sel-ao{outline:2.5px solid #b7770d;outline-offset:-2px}
  .tj-c.sel-an{outline:2.5px solid #e05252;outline-offset:-2px}

  /* Score: circulo y colores */
  .tj-circ{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .tj-h1{background:#d63031;color:#ffdd57}
  .tj-bir{background:#00b894;color:#fff}
  .tj-par{background:#fdf8e1;color:#1a1a2e}
  .tj-bog{background:#74b9ff;color:#0056b3}
  .tj-dbl{background:#0984e3;color:#fff}
  .tj-putt-zero{color:#2e7d32;font-weight:700}
  .tj-putt-num{color:#7c5cbf;font-weight:700}
  .tj-ban-pos{color:#e05252;font-weight:700}
  .tj-ban-neg{color:#00a896;font-weight:700}

  /* Controles */
  .tj-ctrl{background:#fff;margin:10px 8px;border-radius:14px;padding:14px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
  .tj-input-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .tj-bnum{width:64px;height:64px;border-radius:14px;border:1.5px solid #e8ecf0;background:#edf0f4;color:#1a1a2e;font-size:21px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .tj-bnum:active{transform:scale(.97)}
  .tj-bdist-m{width:64px;height:64px;border-radius:14px;border:none;background:#fdecea;color:#e05252;font-size:28px;font-weight:700;cursor:pointer;font-family:inherit}
  .tj-bdist-p{width:64px;height:64px;border-radius:14px;border:none;background:#e8f8f5;color:#00a896;font-size:28px;font-weight:700;cursor:pointer;font-family:inherit}
  .tj-bbun{width:64px;height:64px;border-radius:14px;border:1.5px solid #e8ecf0;background:#edf0f4;font-size:28px;cursor:pointer;font-family:inherit}
  .tj-bbun.on{border:2.5px solid #b7770d;background:#fff8ee}
  .tj-bpen{width:64px;height:64px;border-radius:14px;border:1.5px solid #e8ecf0;background:#edf0f4;font-size:24px;cursor:pointer;font-family:inherit}
  .tj-bpen.on-agua{border:2.5px solid #2980b9;background:#eaf4ff}
  .tj-bpen.on-arbol{border:2.5px solid #2d8a4e;background:#e8f5e9}
  .tj-bpen.on-zona{border:2.5px solid #e05252;background:#fdecea}
  .tj-bpen.on-ob{border:2.5px solid #555;background:#eee}

  .tj-nav{display:flex;gap:44px;align-items:center}
  .tj-bant{padding:7px 16px;border-radius:10px;border:1.5px solid #e8ecf0;background:#edf0f4;color:#8a95a3;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .tj-bdown{height:40px;padding:0 28px;border-radius:10px;border:none;background:#1976d2;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}

  .tj-fin{display:flex;gap:8px;width:100%}
  .tj-fin button{flex:1;padding:13px 8px;border-radius:12px;border:none;font-size:13px;font-weight:700;letter-spacing:.3px;color:#fff;cursor:pointer;font-family:inherit}
  .tj-fin .tj-new{background:#1a1a2e}
  .tj-fin .tj-end{background:#00a896}

  /* Modales */
  .tj-mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center;padding:20px}
  .tj-mbg.show{display:flex}
  .tj-modal{background:#fff;border-radius:18px;padding:28px 24px;max-width:300px;width:90%;text-align:center}
  .tj-modal h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .tj-modal p{font-size:13px;color:#8a95a3;margin-bottom:22px}
  .tj-modal-btns{display:flex;gap:10px}
  .tj-modal-btns button{flex:1;padding:12px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .tj-mb-cancel{background:#edf0f4;color:#8a95a3}
  .tj-mb-confirm{background:#e05252;color:#fff}
  .tj-mb-confirm.green{background:#00a896}
  .tj-modal input[type=number]{width:100%;padding:12px;font-size:22px;text-align:center;border:1.5px solid #e8ecf0;border-radius:10px;margin-bottom:18px;font-family:inherit;outline:none}

  /* Resumen pantalla completa */
  .tj-summary{display:none;position:fixed;inset:0;background:#edf0f4;z-index:998;overflow-y:auto}
  .tj-summary.show{display:block}
  .tj-sum-hdr{background:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8ecf0;position:sticky;top:0;z-index:1}
  .tj-sum-hdr h2{font-size:14px;font-weight:700}
  .tj-sum-back{padding:6px 12px;border-radius:8px;border:1.5px solid #e8ecf0;background:#edf0f4;color:#8a95a3;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
  .tj-sum-body{padding:10px 8px;max-width:520px;margin:0 auto}
  .tj-sum-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tj-sum-card h4{font-size:11px;font-weight:700;color:#8a95a3;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
  .tj-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tj-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tj-stat{background:#edf0f4;border-radius:10px;padding:8px 10px}
  .tj-stat-lbl{font-size:10px;color:#8a95a3;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .tj-stat-val{font-size:20px;font-weight:700;color:#1a1a2e;margin-top:2px}
  .tj-stat-val.green{color:#00a896}
  .tj-stat-val.red{color:#e05252}
  .tj-sum-text{background:#1a1a2e;color:#cfd5dc;padding:14px;border-radius:10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre-wrap;line-height:1.55;margin-top:6px;margin-bottom:14px}
  .tj-copy-btn{margin-top:0;width:100%;padding:11px;border-radius:10px;border:none;background:#1976d2;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .tj-save-btn{width:100%;padding:16px;border:none;border-radius:12px;background:#00a896;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .tj-save-btn:disabled,.tj-save-btn.done{background:#15803d;cursor:default;opacity:1}
</style>

    <h2>&#9971; Resumen de la ronda</h2>

  </div>

<script>
(function(){
  /* =========================================================
     TARJETA P&P - escrita siguiendo la spec literal de Ferran
     ========================================================= */

  var N = 18, PAR = 3;

  var CAMPOS_BASE = [
    "Accura Tei\u00e0","Bellpuig","bon\u00c0rea","Cambrils","Can Cuy\u00e0s",
    "Can Mascar\u00f3","Can Pascual","Can Rafael","Canal Ol\u00edmpic",
    "Castell Godmar","Castell\u00f3-Empuriabrava","Costa Daurada","El Vall\u00e8s",
    "El Vendrell","Fornells","Franciac","Golf Lloret","Gualta","HCP 1",
    "La Garriga","Lleida","Mas Gurumbau","Mas Nou","Mas Pag\u00e8s","Mas Tapiolas",
    "Mas Torrellas","Montseny","Mora","Oller del Mas","Peralada","Platja d'Aro",
    "Portal del Roc","ROC 3","Sant Cebri\u00e0","Vallromanes"
  ];

  var ICON_LBL = { score:"\ud83c\udfcc\ufe0f", putt:"\u26f3", ban:"\ud83c\udfaf", obs:"\ud83c\udfd6\ufe0f", pen:"\ud83d\udc80" };
  var FILAS = ["score","putt","ban","obs","pen"];
  var FILA_CLS = { score:"as", putt:"ap", ban:"ad", obs:"ao", pen:"an" };

  function nuevoEstado(){
    return {
      score: new Array(N).fill(null),
      putt:  new Array(N).fill(null),
      ban:   new Array(N).fill(null),
      obs:   new Array(N).fill(null),
      pen:   new Array(N).fill(null),
      activo:0,
      fila:"score",
      guardada:false
    };
  }
  window.S = nuevoEstado();
  try {
    var saved = JSON.parse(localStorage.getItem("pp9"));
    if (saved && Array.isArray(saved.score) && saved.score.length === N) {
      window.S = saved;
    }
  } catch(e){}

  function persistEstado(){
    try { localStorage.setItem("pp9", JSON.stringify(window.S)); } catch(e){}
  }

  // ======== CAMPOS ========
  function rellenaSelectCampos(){
    var sel = document.getElementById("tj-campo");
    sel.innerHTML = "";
    var op0 = document.createElement("option");
    op0.value = ""; op0.textContent = "Campo...";
    sel.appendChild(op0);
    var lista = [];
    CAMPOS_BASE.forEach(function(c){
      lista.push(c);
      lista.push(c + " Eppas");
    });
    lista.sort(function(a,b){ return a.localeCompare(b,"es"); });
    var customs = [];
    try { customs = JSON.parse(localStorage.getItem("pp_customs") || "[]"); } catch(e){}
    customs.forEach(function(c){ if (lista.indexOf(c) === -1) lista.push(c); });
    lista.forEach(function(c){
      var op = document.createElement("option");
      op.value = c; op.textContent = c;
      sel.appendChild(op);
    });
    var opc = document.createElement("option");
    opc.value = "__custom__";
    opc.textContent = "\u270f\ufe0f Otro campo...";
    sel.appendChild(opc);
    var savedC = localStorage.getItem("pp_course") || "";
    if (savedC && lista.indexOf(savedC) !== -1) sel.value = savedC;
  }
  window.tjOnCampo = function(v){
    var mw = document.getElementById("tj-manual");
    if (v === "__custom__"){
      mw.classList.add("show");
      setTimeout(function(){ document.getElementById("tj-manual-in").focus(); }, 50);
    } else {
      mw.classList.remove("show");
      localStorage.setItem("pp_course", v);
    }
  };
  window.tjOnManual = function(v){
    if (!v) return;
    localStorage.setItem("pp_course", v);
    var customs = [];
    try { customs = JSON.parse(localStorage.getItem("pp_customs") || "[]"); } catch(e){}
    if (customs.indexOf(v) === -1){
      customs.push(v);
      localStorage.setItem("pp_customs", JSON.stringify(customs));
    }
  };

  // ======== HEADER ========
  function renderHeader(){
    var jugados = 0, total = 0;
    for (var i=0;i<N;i++){ if (S.score[i] !== null){ jugados++; total += S.score[i]; } }
    var pn = document.getElementById("tj-pill-num");
    var pl = document.querySelector(".tj-pill-lbl");
    if (jugados === 0){
      pn.textContent = "\u2014";
      pl.textContent = "GOLPES";
    } else {
      var d = total - jugados * PAR;
      pn.textContent = (d > 0 ? "+"+d : (d === 0 ? "PAR" : String(d)));
      pl.textContent = total + " GOLPES";
    }
  }

  // ======== TABLAS ========
  function renderTablas(){
    var cont = document.getElementById("tj-tablas");
    cont.innerHTML = "";
    cont.appendChild(seccion(0, 8, "Holes 1\u20139", "OUT"));
    cont.appendChild(seccion(9, 17, "Holes 10\u201318", "IN"));
  }
  function seccion(desde, hasta, titulo, sufijo){
    var sec = document.createElement("div");
    sec.className = "tj-sec";
    var tit = document.createElement("div");
    tit.className = "tj-sec-title";
    tit.textContent = titulo;
    sec.appendChild(tit);

    var tbl = document.createElement("table");
    tbl.className = "tj-tbl";
    var tbody = document.createElement("tbody");

    var trH = document.createElement("tr");
    var tdH0 = document.createElement("td");
    tdH0.className = "tj-hdr-lbl";
    tdH0.textContent = "Hole";
    trH.appendChild(tdH0);
    for (var i = desde; i <= hasta; i++){
      var th = document.createElement("td");
      th.className = "tj-h" + (S.activo === i ? " sel" : "");
      th.textContent = (i+1);
      (function(idx){ th.onclick = function(){ S.activo = idx; persistEstado(); render(); }; })(i);
      trH.appendChild(th);
    }
    var tdSum = document.createElement("td");
    tdSum.className = "tj-sum tj-sum-out";
    tdSum.textContent = sufijo;
    trH.appendChild(tdSum);
    tbody.appendChild(trH);

    FILAS.forEach(function(key){
      tbody.appendChild(filaDatos(key, desde, hasta));
    });

    tbl.appendChild(tbody);
    sec.appendChild(tbl);
    return sec;
  }
  function filaDatos(key, desde, hasta){
    var tr = document.createElement("tr");
    var clsFila = FILA_CLS[key];
    var tdL = document.createElement("td");
    tdL.className = "tj-lbl " + clsFila + (S.fila === key ? " act" : "");
    tdL.textContent = ICON_LBL[key];
    tdL.onclick = function(){ S.fila = key; persistEstado(); render(); };
    tr.appendChild(tdL);

    var sumNum = 0, hasN = false, bp = 0, bm = 0;
    for (var i = desde; i <= hasta; i++){
      var td = document.createElement("td");
      var sel = (S.activo === i && S.fila === key) ? " sel-" + clsFila : "";
      td.className = "tj-c" + sel;
      var v = S[key][i];
      if (key === "score"){
        if (v !== null){
          var span = document.createElement("span");
          var cls = "tj-circ ";
          if (v === 1) cls += "tj-h1";
          else if (v <= 2) cls += "tj-bir";
          else if (v === 3) cls += "tj-par";
          else if (v === 4) cls += "tj-bog";
          else cls += "tj-dbl";
          span.className = cls;
          span.textContent = v;
          td.appendChild(span);
          sumNum += v; hasN = true;
        }
      } else if (key === "putt"){
        if (v !== null){
          var sp = document.createElement("span");
          sp.className = (v === 0 ? "tj-putt-zero" : "tj-putt-num");
          sp.textContent = v;
          td.appendChild(sp);
          sumNum += v; hasN = true;
        }
      } else if (key === "ban"){
        if (v === "+"){ td.innerHTML = "<span class='tj-ban-pos'>+</span>"; bp++; }
        else if (v === "-"){ td.innerHTML = "<span class='tj-ban-neg'>\u2212</span>"; bm++; }
      } else if (key === "obs"){
        if (v) td.textContent = v;
      } else if (key === "pen"){
        if (v) td.textContent = v;
      }
      (function(idx, k){ td.onclick = function(){ S.activo = idx; S.fila = k; persistEstado(); render(); }; })(i, key);
      tr.appendChild(td);
    }

    var ts = document.createElement("td");
    ts.className = "tj-sum tj-sum-" + key;
    if (key === "score" || key === "putt"){
      if (hasN) ts.textContent = sumNum;
    } else if (key === "ban"){
      if (bp || bm) ts.textContent = "+" + bp + "/-" + bm;
    }
    tr.appendChild(ts);
    return tr;
  }

  // ======== CONTROLES ========
  function renderCtrl(){
    var c = document.getElementById("tj-ctrl");
    c.innerHTML = "";

    var inputRow = document.createElement("div");
    inputRow.className = "tj-input-row";

    if (S.fila === "score" || S.fila === "putt"){
      var bm = document.createElement("button");
      bm.className = "tj-bnum";
      bm.textContent = "\u2212";
      bm.onclick = function(){ ajusta(-1); };
      var bp = document.createElement("button");
      bp.className = "tj-bnum";
      bp.textContent = "+";
      bp.onclick = function(){ ajusta(+1); };
      inputRow.appendChild(bm);
      inputRow.appendChild(bp);
    } else if (S.fila === "ban"){
      var bm2 = document.createElement("button");
      bm2.className = "tj-bdist-m";
      bm2.textContent = "\u2212";
      bm2.onclick = function(){ toggleBan("-"); };
      var bp2 = document.createElement("button");
      bp2.className = "tj-bdist-p";
      bp2.textContent = "+";
      bp2.onclick = function(){ toggleBan("+"); };
      inputRow.appendChild(bm2);
      inputRow.appendChild(bp2);
    } else if (S.fila === "obs"){
      var bb = document.createElement("button");
      var bunEmoji = "\ud83c\udfd6\ufe0f";
      bb.className = "tj-bbun" + (S.obs[S.activo] === bunEmoji ? " on" : "");
      bb.textContent = bunEmoji;
      bb.onclick = function(){ toggleObs(bunEmoji); };
      inputRow.appendChild(bb);
    } else if (S.fila === "pen"){
      var pens = [
        { e:"\ud83d\udca7", cls:"on-agua"  },
        { e:"\ud83c\udf33", cls:"on-arbol" },
        { e:"\ud83d\udea7", cls:"on-zona"  },
        { e:"\ud83d\udeab", cls:"on-ob"    }
      ];
      pens.forEach(function(p){
        var btn = document.createElement("button");
        btn.className = "tj-bpen" + (S.pen[S.activo] === p.e ? " " + p.cls : "");
        btn.textContent = p.e;
        btn.onclick = function(){ togglePen(p.e); };
        inputRow.appendChild(btn);
      });
    }
    c.appendChild(inputRow);

    var nav = document.createElement("div");
    nav.className = "tj-nav";
    var ant = document.createElement("button");
    ant.className = "tj-bant";
    ant.innerHTML = "&larr; Ant";
    ant.onclick = function(){ S.activo = (S.activo <= 0 ? N-1 : S.activo - 1); S.fila = "score"; persistEstado(); render(); };
    var down = document.createElement("button");
    down.className = "tj-bdown";
    down.textContent = "\u2193";
    down.onclick = bajarFila;
    var sig = document.createElement("button");
    sig.className = "tj-bant";

  // ======== ACCIONES ========
  function ajusta(delta){
    var i = S.activo;
    if (S.fila === "score"){
      var v = S.score[i];
      if (v === null){
        // celda vacia: solo + arranca en 1, - no hace nada
        if (delta > 0) S.score[i] = 1;
      } else {
        var nv = v + delta;
        if (nv < 1) S.score[i] = null;       // bajar de 1 -> vacio
        else if (nv > 99) S.score[i] = 99;
        else S.score[i] = nv;
      }
    } else if (S.fila === "putt"){
      var v2 = S.putt[i];
      if (v2 === null){
        // celda vacia: solo + arranca en 1, - no hace nada
        if (delta > 0) S.putt[i] = 1;
      } else {
        var nv2 = v2 + delta;
        if (nv2 < 0) S.putt[i] = null;        // bajar de 0 -> vacio
        else if (nv2 > 9) S.putt[i] = 9;
        else S.putt[i] = nv2;
      }
    }
    persistEstado(); render();
  }
  function toggleBan(sign){
    var i = S.activo;
    S.ban[i] = (S.ban[i] === sign ? null : sign);
    persistEstado(); render();
  }
  function toggleObs(emo){
    var i = S.activo;
    S.obs[i] = (S.obs[i] === emo ? null : emo);
    persistEstado(); render();
  }
  function togglePen(emo){
    var i = S.activo;
    S.pen[i] = (S.pen[i] === emo ? null : emo);
    persistEstado(); render();
  }
  function bajarFila(){
    var idx = FILAS.indexOf(S.fila);
    if (idx < 0 || idx === FILAS.length - 1){
      if (S.activo < N - 1){
        S.activo = S.activo + 1;
        S.fila = "score";
      }
    } else {
      S.fila = FILAS[idx + 1];
    }
    persistEstado(); render();
  }

  function calcStats(bola){
    var birdies=0, pares=0, bogeys=0, dobles=0;
    var gir=0, p3=0, pm3=0, triputts=0, rec=0, sp=0;
    var bunker=0, agua=0, pen=0;
    var jugados=0, total=0;
    for (var i=0;i<N;i++){
      var sc=S.score[i], pt=S.putt[i], bn=S.ban[i], ob=S.obs[i], pe=S.pen[i];
      if (sc === null) continue;
      jugados++; total += sc;
      var dh = sc - PAR;
      if (dh <= -1) birdies++;
      else if (dh === 0) pares++;
      else if (dh === 1) bogeys++;
      else dobles++;
      var hasGIR = (pt !== null && (sc - pt) === 1);
      if (hasGIR){
        gir++;
        if (bn === "-") p3++;
        else if (bn === "+") pm3++;
      }
      if (pt !== null && pt >= 3) triputts++;
      if (!hasGIR && dh <= 0){
        if (dh <= -1) sp++;
        else rec++;
      }
      if (ob === "\ud83c\udfd6\ufe0f") bunker++;
      if (pe === "\ud83d\udca7") agua++;
      else if (pe === "\ud83c\udf33" || pe === "\ud83d\udea7" || pe === "\ud83d\udeab") pen++;
    }
    var diff = total - jugados * PAR;
    var totalStr = diff > 0 ? "+"+diff : (diff === 0 ? "PAR" : String(diff));
    return {
      jugados:jugados, total:total, totalStr:totalStr, diff:diff,
      birdies:birdies, pares:pares, bogeys:bogeys, dobles:dobles,
      gir:gir, p3:p3, pm3:pm3, triputts:triputts, rec:rec, sp:sp,
      bunker:bunker, agua:agua, pen:pen, bola:bola
    };
  }

    var c2 = document.createElement("div");

    g2.className = "tj-grid3";
    g2.innerHTML =

      "<div class='tj-stat'><div class='tj-stat-lbl'>Pares</div><div class='tj-stat-val'>"+st.pares+"</div></div>"+
      "<div class='tj-stat'><div class='tj-stat-lbl'>Bogeys</div><div class='tj-stat-val'>"+st.bogeys+"</div></div>"+

      "<div class='tj-stat'><div class='tj-stat-lbl'>3-Putts</div><div class='tj-stat-val'>"+st.triputts+"</div></div>";
    c2.appendChild(g2);

    var c3 = document.createElement("div");

    c3.innerHTML = "<h4>Approach</h4>";
    var g3 = document.createElement("div");
    g3.className = "tj-grid2";
    g3.innerHTML =
      "<div class='tj-stat'><div class='tj-stat-lbl'>P&lt;3m</div><div class='tj-stat-val green'>"+st.p3+"</div></div>"+
      "<div class='tj-stat'><div class='tj-stat-lbl'>P&gt;3m</div><div class='tj-stat-val'>"+st.pm3+"</div></div>"+
      "<div class='tj-stat'><div class='tj-stat-lbl'>Recuperaciones</div><div class='tj-stat-val green'>"+st.rec+"</div></div>"+
      "<div class='tj-stat'><div class='tj-stat-lbl'>Super rec</div><div class='tj-stat-val green'>"+st.sp+"</div></div>";
    c3.appendChild(g3);

    var c4 = document.createElement("div");
    c4.className = "tj-sum-card";

    var g4 = document.createElement("div");
    g4.className = "tj-grid2";

  function guardarRonda(st, fecha, campo){
    // Validaciones
    var faltan = 0;
    for (var i=0;i<S.score.length;i++) if (S.score[i] === null) faltan++;
    if (faltan > 0){
      alert("Faltan " + faltan + " hoyo(s) por rellenar antes de guardar.");
      return false;
    }
    if (!campo || campo === "Desconocido"){
      alert("Selecciona un campo antes de guardar.");
      return false;
    }
    // Calcular siguiente n
    var maxN = 0;
    for (var k=0;k<RAW.length;k++) if (RAW[k].n > maxN) maxN = RAW[k].n;
    var newN = maxN + 1;
    // Calcular hi1
    var hi1 = 0;
    for (var j=0;j<S.score.length;j++) if (S.score[j] === 1) hi1++;
    // Construir entrada RAW (mismos 20 campos que las rondas R211+)
    var entry = {
      n: newN,
      fecha: fecha,
      campo: campo,
      total: st.totalStr,
      totalNum: st.diff,
      hi1: hi1,
      bir: st.birdies,
      par: st.pares,
      bog: st.bogeys,
      dbl: st.dobles,
      gir: st.gir,
      trip: st.triputts,
      p3: st.p3,
      pm3: st.pm3,
      rec: st.rec,
      sp: st.sp,
      bun: st.bunker,
      agua: st.agua,
      pen: st.pen,
      bola: st.bola
    };
    var holes = S.score.slice();
    var putts = S.putt.slice();
    var ban   = S.ban.slice();
    var obs   = S.obs.slice();
    var pen   = S.pen.slice();
    // Persistir en localStorage
    try {
      var extra = JSON.parse(localStorage.getItem("pp_extra_rounds") || "[]");
      extra.push({ raw: entry, holes: holes, putts: putts, ban: ban, obs: obs, pen: pen });
      localStorage.setItem("pp_extra_rounds", JSON.stringify(extra));
    } catch(e){
      alert("Error guardando: " + e.message);
      return false;
    }
    // Mergear en memoria (todos los globales)
    RAW.push(entry);
    var kk = String(newN);
    HOLES_DATA[kk] = holes;
    PUTTS_DATA[kk] = putts;
    BAN_DATA[kk]   = ban;
    OBS_DATA[kk]   = obs;
    PEN_DATA[kk]   = pen;
    // Recalcular campos derivados (totalNum, total, bir, par, bog, dbl, hi1, y agregados de eventos si hay datos hoyo a hoyo)
    try { normalizeRAW(); } catch(e){}
    // Actualizar contador del header
    try {
      var hdr = document.getElementById("hdr");
      if (hdr) hdr.textContent = "Iron Capi \u2014 " + RAW.length + " rondas \u00b7 Ferran Lob\u00f3n";
    } catch(e){}
    // Re-renderizar la pestaña Tabla (no tiene cache lazy)
    try { if (typeof renderTable === "function") renderTable(); } catch(e){}
    // Invalidar la cache de las pestañas lazy (Stats, Records, Last10/20/30)
    // para que se redibujen la proxima vez que se abran
    try {
      if (typeof rendered === "object" && rendered){
        rendered.stats = false;
        rendered.records = false;
        rendered.last10 = false;
        rendered.last20 = false;
        rendered.last30 = false;
      }
    } catch(e){}
    return true;
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c];
    });
  }

  function render(){
    renderHeader();
    renderTablas();
    renderCtrl();
  }
  window.render = render;

  rellenaSelectCampos();
  render();
})();

function exportarExcelMaestro(){
  if(typeof XLSX==="undefined"){alert("SheetJS no esta cargado. Necesitas conexion a internet la primera vez para que el navegador descargue la libreria.");return;}
  var btn=document.getElementById("excel-maestro-btn");
  var oldHTML=btn.innerHTML;
  btn.innerHTML='<div style="background:#fef3c7;padding:14px;text-align:center;font-weight:700;color:#92400e;font-size:13px">Generando Excel...</div>';
  setTimeout(function(){
    try{ generarExcel(); btn.innerHTML='<div style="background:#dcfce7;padding:14px;text-align:center;font-weight:700;color:#15803d;font-size:13px">Excel descargado!</div>'; setTimeout(function(){btn.innerHTML=oldHTML;},1800); }
    catch(e){ btn.innerHTML='<div style="background:#fee2e2;padding:14px;text-align:center;font-weight:700;color:#991b1b;font-size:12px">Error: '+e.message+'</div>'; setTimeout(function(){btn.innerHTML=oldHTML;},3000); }
  },50);

function exportarJSON(){
  var btn=document.getElementById("export-json-btn");
  var oldHTML=btn.innerHTML;
  try{
    var payload={
      version:1,
      exported_at:new Date().toISOString(),
      total_rounds:RAW.length,
      RAW:RAW,
      HOLES_DATA:HOLES_DATA,
      PUTTS_DATA:PUTTS_DATA,
      BAN_DATA:BAN_DATA,
      OBS_DATA:OBS_DATA,
      PEN_DATA:PEN_DATA
    };
    var jsonStr=JSON.stringify(payload,null,2);
    var d=new Date();
    var YYYY=d.getFullYear(),MM=String(d.getMonth()+1).padStart(2,"0"),DD=String(d.getDate()).padStart(2,"0");
    var fname="ironcapi_"+YYYY+MM+DD+".json";
    var blob=new Blob([jsonStr],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
    btn.innerHTML='<div style="background:#dbeafe;padding:14px;text-align:center;font-weight:700;color:#1e40af;font-size:13px">JSON descargado!</div>';
    setTimeout(function(){btn.innerHTML=oldHTML;},1800);
  }catch(e){
    btn.innerHTML='<div style="background:#fee2e2;padding:14px;text-align:center;font-weight:700;color:#991b1b;font-size:12px">Error: '+e.message+'</div>';
    setTimeout(function(){btn.innerHTML=oldHTML;},3000);
  }
}

function importarJSON(ev){
  var btn=document.getElementById("import-json-btn");
  var oldHTML=btn.innerHTML;
  var file=ev.target.files&&ev.target.files[0];
  if(!file){return;}
  if(!confirm("Esto sobrescribira la BDD actual con el contenido del JSON.\n\nSe recomienda hacer EXPORTAR JSON antes como backup.\n\nContinuar?")){
    ev.target.value="";return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data||!Array.isArray(data.RAW)||!data.HOLES_DATA){
        throw new Error("JSON invalido: faltan RAW o HOLES_DATA");
      }
      var extras=[];
      for(var i=0;i<data.RAW.length;i++){
        var r=data.RAW[i];
        var k=String(r.n);
        var entry={raw:r,holes:data.HOLES_DATA[k]};
        if(data.PUTTS_DATA&&data.PUTTS_DATA[k])entry.putts=data.PUTTS_DATA[k];
        if(data.BAN_DATA&&data.BAN_DATA[k])entry.ban=data.BAN_DATA[k];
        if(data.OBS_DATA&&data.OBS_DATA[k])entry.obs=data.OBS_DATA[k];
        if(data.PEN_DATA&&data.PEN_DATA[k])entry.pen=data.PEN_DATA[k];
        extras.push(entry);
      }
      localStorage.setItem("pp_extra_rounds_full",JSON.stringify(extras));
      localStorage.setItem("pp_extra_rounds","[]");
      btn.innerHTML='<div style="background:#dcfce7;padding:14px;text-align:center;font-weight:700;color:#15803d;font-size:13px">Importado! Recargando...</div>';
      setTimeout(function(){location.reload();},1200);
    }catch(err){
      btn.innerHTML='<div style="background:#fee2e2;padding:14px;text-align:center;font-weight:700;color:#991b1b;font-size:12px">Error: '+err.message+'</div>';
      setTimeout(function(){btn.innerHTML=oldHTML;},3500);
    }
    ev.target.value="";
  };
  reader.onerror=function(){
    btn.innerHTML='<div style="background:#fee2e2;padding:14px;text-align:center;font-weight:700;color:#991b1b;font-size:12px">Error leyendo archivo</div>';
    setTimeout(function(){btn.innerHTML=oldHTML;},3000);
    ev.target.value="";
  };
  reader.readAsText(file);
}

  var hdr01=["n","fecha","campo","total","totalNum","hi1","bir","par","bog","dbl","gir","trip","p3","pm3","rec","sp","bun","agua","pen","bola"];
  var rows01=[hdr01];
  for(var i=0;i<RAW.length;i++){
    var r=RAW[i];
    rows01.push([r.n,r.fecha,r.campo,null,null,null,null,null,null,null,

      r.pen!=null?r.pen:"",r.bola!=null?r.bola:""]);
  }
  var ws01=XLSX.utils.aoa_to_sheet(rows01);
  // Formulas derivables: D=total, E=totalNum, F=hi1, G=bir, H=par, I=bog, J=dbl
  for(var i=0;i<RAW.length;i++){

    ["   border:2px solid #16a34a, header bg:#f0fdf4, text:#16a34a"],

    [""],
    ["3. Caja roja FLUJO NUEVA CONVERSACION"],
    ["   border:2px solid #dc2626, 4 pasos del protocolo"],
    [""],
    ["4. Caja amarilla PLANTILLA TARJETA"],
    ["   border:#fde68a, contiene <pre> con plantilla 19 campos + boton copiar"],
    [""],
    ["5. Caja indigo EXCEL MAESTRO (descripcion comando texto Claude)"],
    [""],
    ["6. Caja azul ESTADO con: rondas, periodo, ultima, num campos"]
  ]),"10_Spec_Comandos");

  // ===== 11_Logica_Handicap =====
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ["LOGICA HANDICAP"],[""],
    ["Handicap rolling N = media aritmetica de los totalNum de las ultimas N rondas"],
    [""],
    ["Pseudocodigo:"],
    ["function rollingHandicap(N){"],
    ["  if (RAW.length < N) return null;"],
    ["  var slice = RAW.slice(-N);"],
    ["  var sum = slice.reduce(function(a,r){return a+r.totalNum;}, 0);"],
    ["  return sum / N;"],
    ["}"],
    [""],
    ["Best handicap historico ventana N:"],
    ["function bestHandicap(N){"],
    ["  if (RAW.length < N) return null;"],
    ["  var best=Infinity, idx=0;"],
    ["  for(var i=0; i<=RAW.length-N; i++){"],
    ["    var s=0; for(var j=i;j<i+N;j++) s+=RAW[j].totalNum;"],
    ["    var avg=s/N; if(avg<best){best=avg; idx=i;}"],
    ["  }"],
    ["  return {avg:best, fromN:RAW[idx].n, toN:RAW[idx+N-1].n};"],
    ["}"],
    [""],
    ["Sale/Entra para tab Last N:"],
    ["sale  = RAW[RAW.length - N - 1]  (saldra al añadir la siguiente ronda)"],
    ["entra = RAW[RAW.length - N]      (oldest actualmente DENTRO de la ventana)"]
  ]),"11_Logica_Handicap");

  // ===== 12_Logica_Stats =====
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ["LOGICA STATS - DEFINICIONES"],[""],
    ["HI1 (hole in one)         = score === 1"],
    ["BIR (birdie)              = score === 2"],
    ["PAR                       = score === 3"],
    ["BOG (bogey)               = score === 4"],
    ["DBL+ (doble bogey o peor) = score >= 5"],
    [""],
    ["GIR (Green In Regulation) = score - putts == 1 (llego al green con un solo golpe)"],
    [""],
    ["BAN_DATA marca distancia al pin tras GIR:"],
    ["  '-' = a menos de 3m"],
    ["  '+' = a mas de 3m"],
    ["  null = no hubo GIR"],
    [""],
    ["P3  (P<3m) = greens en regulacion donde la bola quedo a menos de 3m del hoyo"],
    ["PM3 (P>3m) = greens en regulacion donde la bola quedo a mas de 3m del hoyo"],
    [""],
    ["TRIP (triputts) = putts en el hoyo >= 3"],
    [""],
    ["REC (recuperacion)        = par sin GIR (score==3 y NO GIR)"],
    ["SP  (super recuperacion)  = birdie sin GIR (score<=2 y NO GIR)"],
    [""],
    ["BUN  (bunker)        = en OBS_DATA, hoyos con emoji bunker (\\ud83c\\udfd6\\ufe0f)"],
    ["AGUA                 = en PEN_DATA, hoyos con emoji agua (\\ud83d\\udca7)"],
    ["PEN  (penalidad otra) = otros hazards (\\ud83c\\udf33,\\ud83d\\udea7,\\ud83d\\udeab)"],
    ["BOLA (bola perdida)  = se trackea aparte"]
  ]),"12_Logica_Stats");

  // ===== 13_Logica_Colores =====
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ["LOGICA COLORES"],[""],
    ["SCORES (color de fondo del badge):"],
    ["score=1   bg:#d63031 text:#ffdd57   (hoyo en uno, rojo+amarillo)"],
    ["score=2   bg:#00b894 text:#ffffff   (eagle/birdie, verde)"],
    ["score=3   bg:#fdf8e1 text:#1a1a2e   (par, crema)"],
    ["score=4   bg:#74b9ff text:#0056b3   (bogey, cyan claro)"],
    ["score>=5  bg:#0984e3 text:#ffffff   (doble+, azul)"],
    [""],
    ["TABLA hBg() simplificado (background tabla):"],
    ["score<=2  -> #65d000 (verde brillante)"],
    ["score==3  -> sin color (neutro)"],
    ["score==4  -> #06b6d4 (cyan)"],
    ["score>=5  -> #1e3a8a (azul oscuro)"],
    [""],
    ["TOTAL badges:"],
    ["totalNum<0   verde #15803d (bg #65d000)"],
    ["totalNum==0  gris #6b7280 'PAR'/'E'"],
    ["totalNum>0   rojo #b91c1c (bg #1e3a8a) formato '+X'"],
    [""],
    ["TABS (CSS variable --tc):"],
    ["Nueva    #00a896"],
    ["Tabla    #1a7f4b"],
    ["Stats    #6d28d9"],
    ["Records  #b8860b"],
    ["Last10   #1565c0"],
    ["Last20   #0e7490"],
    ["Last30   #0f766e"],
    ["Comandos #dc2626"],
    [""],
    ["BOTON Excel Maestro (verde):"],
    ["border:2px solid #16a34a, header bg:#f0fdf4 border-bottom:#86efac, text:#16a34a"],
    [""],
    ["CAMPO COLORS: ver hoja 03_Datos_Campos"]
  ]),"13_Logica_Colores");

  // ===== 14_Protocolo_Tarjeta =====
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ["PROTOCOLO TARJETA - PLANTILLA 19 CAMPOS"],[""],
    ["Fecha: DD/MM/AAAA"],
    ["Campo: NOMBRE_CAMPO"],
    ["Total: +X"],
    ["Hoyos H1-H18: h1,...,h18"],
    ["Putts H1-H18: p1,...,p18"],
    ["Birdies (bir): X"],
    ["Pares (par): X"],
    ["Bogeys (bog): X"],
    ["Dobles+ (dbl): X"],
    ["GIR total: X"],
    ["P<3m (p3): X"],
    ["P>3m (pm3): X"],
    ["Triputts (trip): X"],
    ["Recuperaciones (rec): X"],
    ["SP/Super rec (sp): X"],
    ["Bunker (bun): X"],
    ["Agua (agua): X"],
    ["Penalidad (pen): X"],
    ["Bola perdida (bola): X"],
    [""],
    ["FLUJO NUEVA CONVERSACION:"],
    ["1. Sube el HTML existente"],
    ["2. Claude pide la tarjeta"],
    ["3. Pegas la tarjeta en formato 19 campos"],
    ["4. Claude entrega HTML + Excel actualizados"],
    [""],
    ["COMANDO 'COMPLETA': rellenar todos los campos sin omitir"],
    ["COMANDO 'EXCEL MAESTRO': solicitar Excel con 15 hojas (o pulsar boton verde en HTML)"]
  ]),"14_Protocolo_Tarjeta");

  // ===== 99_Validaciones =====
  var totalSum=0,tBir=0,tPar=0,tBog=0,tDbl=0,tHi1=0,tGir=0;
  var minT=Infinity,minN=0,maxT=-Infinity,maxN=0;
  for(var i=0;i<RAW.length;i++){
    var rr=RAW[i];
    totalSum+=rr.totalNum; tBir+=rr.bir||0; tPar+=rr.par||0; tBog+=rr.bog||0; tDbl+=rr.dbl||0;
    tHi1+=rr.hi1||0; tGir+=rr.gir||0;
    if(rr.totalNum<minT){minT=rr.totalNum; minN=rr.n;}
    if(rr.totalNum>maxT){maxT=rr.totalNum; maxN=rr.n;}
  }
  var l10=null,l20=null,l30=null;
  if(RAW.length>=10){var s=0;for(var i=RAW.length-10;i<RAW.length;i++)s+=RAW[i].totalNum;l10=s/10;}
  if(RAW.length>=20){var s=0;for(var i=RAW.length-20;i<RAW.length;i++)s+=RAW[i].totalNum;l20=s/20;}
  if(RAW.length>=30){var s=0;for(var i=RAW.length-30;i<RAW.length;i++)s+=RAW[i].totalNum;l30=s/30;}
  var camposU={}; for(var i=0;i<RAW.length;i++) camposU[RAW[i].campo]=1;
  var nCampos=Object.keys(camposU).length;
  var rocCount=0,canRafCount=0;
  for(var i=0;i<RAW.length;i++){
    if(RAW[i].campo==="ROC 3") rocCount++;
    if(RAW[i].campo==="Can Rafael") canRafCount++;
  }
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ["VALIDACIONES - VALORES GOLDEN"],
    ["Si reconstruyes el HTML desde cero, deberias obtener estos mismos valores"],
    [""],
    ["Metrica","Valor"],
    ["Total rondas",RAW.length],
    ["Primera ronda n",firstR.n],
    ["Primera fecha",firstR.fecha],
    ["Primera campo",firstR.campo],
    ["Primera totalNum",firstR.totalNum],
    ["Ultima ronda n",lastR.n],
    ["Ultima fecha",lastR.fecha],
    ["Ultimo campo",lastR.campo],
    ["Ultima totalNum",lastR.totalNum],
    ["Suma totalNum (todas rondas)",totalSum],
    ["Score promedio",Number((totalSum/RAW.length).toFixed(4))],
    ["Total birdies",tBir],
    ["Total pares",tPar],
    ["Total bogeys",tBog],
    ["Total dobles+",tDbl],
    ["Total hoyos en uno",tHi1],
    ["Total GIR (rondas con campo gir)",tGir],
    ["Mejor ronda totalNum",minT],
    ["Mejor ronda n",minN],
    ["Peor ronda totalNum",maxT],
    ["Peor ronda n",maxN],
    ["Handicap last 10",l10!=null?Number(l10.toFixed(4)):""],
    ["Handicap last 20",l20!=null?Number(l20.toFixed(4)):""],
    ["Handicap last 30",l30!=null?Number(l30.toFixed(4)):""],
    ["Numero campos unicos",nCampos],
    ["Rondas en ROC 3",rocCount],
    ["Rondas en Can Rafael",canRafCount]
  ]),"99_Validaciones");

  // Generar y descargar
  var fname=YYYY+MM+DD+"_excel_maestro.xlsx";
  XLSX.writeFile(wb,fname);
}
</script>
